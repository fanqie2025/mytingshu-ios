name: build-ios-ipa

# 云端 macOS 编译 → 未签名 IPA（巨魔 TrollStore 直接安装）
# 注意：本仓库只是 App 外壳，不含任何书源；书源在 App 内「设置 → 导入书源」在线订阅导入。
# feat/** 分支只做「编译 + 产物自检 + 传 artifact」，**不发 Release**（手机上安装的 latest 只由 main 更新）。
on:
  push:
    branches: [ main, master, 'feat/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ldid（伪签名，可选）
        run: brew install ldid || true

      - name: 编译并打包 IPA
        run: bash build_ipa.sh

      - name: 产物自检（Mach-O 必须是合格的 iOS 可执行文件）
        run: |
          cd build
          rm -rf ipa_check && mkdir ipa_check
          unzip -o -q MyTingShu.ipa -d ipa_check
          python3 ../tools/check_macho.py ipa_check/Payload/MyTingShu.app/MyTingShu | tee /tmp/macho.txt
          grep -q "MH_EXECUTE" /tmp/macho.txt || { echo "不是可执行文件（可能是 dylib）"; exit 1; }
          grep -q "arm64" /tmp/macho.txt || { echo "不是 arm64"; exit 1; }
          grep -q "LC_MAIN" /tmp/macho.txt || { echo "缺入口点"; exit 1; }
          test -f ipa_check/Payload/MyTingShu.app/Info.plist || { echo "缺 Info.plist"; exit 1; }
          echo "产物自检通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MyTingShu-ipa
          path: build/MyTingShu.ipa
          if-no-files-found: error

      # 只有 main 才发布：特性分支（feat/**）的构建只作为开发验证的 artifact
      - name: 发到 Release（仅 main，手机可直接下载）
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 我的听书 iOS · 最新构建
          body: |
            未签名 IPA，用 **TrollStore（巨魔）** 直接安装。
            本仓库只是播放器外壳，不含任何书源；书源请在 App 内「设置 → 导入书源」导入。
            构建号：${{ github.run_number }}
          files: build/MyTingShu.ipa
          make_latest: true
